          - heading "What Is Beginner's Day?" [level=2] [ref=e44]
          - paragraph [ref=e45]: Beginner's Day is a special pre-conference event dedicated to welcoming newcomers into the Python community. Through hands-on workshops and supportive mentorship, we're opening doors for aspiring developers, data scientists, and technologists from all backgrounds.
          - generic [ref=e46]:
            - paragraph [ref=e47]: "Our mission:"
            - paragraph [ref=e48]: Create an inclusive, supportive environment where anyone can start their Python journey, regardless of their technical background or experience level.
        - generic [ref=e49]:
          - heading "Advanced Pythonistas Welcome Too!" [level=2] [ref=e50]
          - paragraph [ref=e51]: We are all beginners at something. Even if you're an experienced Python developer, these workshops cover a wide range of topics that might be new to you - from data visualization with Plotnine to game development with PyGame.
          - generic [ref=e52]:
            - generic [ref=e53]:
              - heading "Learn Something New" [level=3] [ref=e54]
              - paragraph [ref=e55]: Expand your Python toolkit by exploring areas outside your expertise. Data scientists can try game development, web developers can dive into data visualization, and everyone can discover new libraries and approaches.
            - generic [ref=e56]:
              - heading "Share Your Knowledge" [level=3] [ref=e57]
              - paragraph [ref=e58]: Join us as a coach! Your experience can help guide newcomers through their first Python steps. Teaching others often deepens your own understanding and gives back to the community that helped you grow.
