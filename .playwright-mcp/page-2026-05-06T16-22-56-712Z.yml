        - generic [ref=e44]:
          - heading "What we built together" [level=2] [ref=e45]
          - paragraph [ref=e46]: PyConZA is more than just a conference. We exist to open doors, connect people, and plant seeds that grow into careers, projects, and stronger communities. As a completely volunteer-run, non-profit event, all money raised goes directly toward making Python more accessible to people who might not otherwise have had the chance to get involved.
          - paragraph [ref=e48]: Your support helps us welcome more people into our community.
        - generic [ref=e49]:
          - heading "How we work" [level=2] [ref=e50]
          - paragraph [ref=e51]: Since we're completely volunteer-run, donations go directly to participants and programming. Our organizers contribute their time because they believe in what we're building.
          - paragraph [ref=e52]: We don't have overhead costs or salaries eating into contributions. Donations fund opportunities, experiences, and futures.
        - generic [ref=e53]:
          - heading "Why this matters" [level=2] [ref=e54]
          - paragraph [ref=e55]: Technology is growing rapidly across South Africa, but learning opportunities aren't equally available everywhere. Your support for PyConZA helps remove barriers that prevent talented people from getting involved in tech.
          - paragraph [ref=e56]: You also helped build bridges between developers who might otherwise work in isolation, and created the kind of catalyst experiences that turn curiosity into careers and careers into community leadership.
          - paragraph [ref=e58]: The people we supported go on to support others in their own communities. The impact multiplies.
        - generic [ref=e59]:
